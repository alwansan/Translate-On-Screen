name: Android build and audit
on:
  push:
    branches: [feature/open-screen-translate]
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify source separation and audit tool
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 -m unittest discover -s tools -p 'test_provision_test_models.py' -v
          python3 -m unittest discover -s tools -p 'test_run_device_tests.py' -v
      - name: Set up Android SDK explicitly
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '13114758' # 19.0, compatible with JDK 17
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Provision pinned offline model test fixtures
        run: |
          python3 tools/provision_test_models.py --cache "$RUNNER_TEMP/ost-test-models" --download-only
          python3 -m pip install --disable-pip-version-check --only-binary=:all: sentencepiece==0.2.1
          python3 tools/generate_marian_fixtures.py --cache "$RUNNER_TEMP/ost-test-models"
      - name: Build, unit tests and Android lint
        env:
          OFFLINE_MODEL_TEST_ROOT: ${{ runner.temp }}/ost-test-models
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Record unit-test and lint evidence
        if: always()
        run: python3 tools/summarize_validation.py
      - name: Verify APK signature, native alignment and packaged licenses
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk --output app/build/reports/package-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: open-screen-translate-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: validation-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
