name: Reproduce reference inventory
on:
  push:
    branches: [feature/open-screen-translate]
    paths: ['tools/**', 'docs/reference-inventory.json', '.github/workflows/reference-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 53a10142656f60b04299fdd8fa073b0d675210ee
          path: reference-input
          persist-credentials: false
      - name: Reproduce static metadata without executing the reference
        run: |
          python3 tools/audit_reference.py --root 'reference-input/Translate+On+Screen_1.188_APKPure_apks_src' --output "$RUNNER_TEMP/reference-inventory.json"
          cmp docs/reference-inventory.json "$RUNNER_TEMP/reference-inventory.json"
