name: Android device behavior

on:
  push:
    branches: [feature/open-screen-translate]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-device.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-device.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Real capture / OCR / offline translation (API ${{ matrix.api }}${{ matrix.suffix }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: google_apis
            suffix: ''
          - api: 35
            target: google_apis
            suffix: ''
          - api: 35
            target: google_apis_ps16k
            suffix: '-16k'
            expected_page_size: 16384
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Assemble app and instrumentation APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Prepare pinned OCR and offline translation fixtures
        run: python3 tools/provision_test_models.py --cache "$RUNNER_TEMP/ost-test-models" --download-only
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native behavior with networking disabled
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            python3 tools/run_device_tests.py --model-cache "$RUNNER_TEMP/ost-test-models"
            --output "app/build/device-tests/api-${{ matrix.api }}${{ matrix.suffix }}"
            ${{ matrix.expected_page_size && format('--expected-page-size {0}', matrix.expected_page_size) || '' }}
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-device-api-${{ matrix.api }}${{ matrix.suffix }}
          path: app/build/device-tests
          if-no-files-found: warn
          retention-days: 14
